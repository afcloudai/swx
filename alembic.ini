# Alembic Configuration (swx-core framework repo)
# ------------------------------------------------
# Points at the framework-owned migration chain shipped in
# swx_core/template/project/migrations (the same chain generated
# projects get). Requires a reachable DATABASE_URL for live runs:
#   alembic -c alembic.ini upgrade head

[alembic]
script_location = swx_core/template/project/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
